name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, mis. v0.1.0-android-alpha (kosongkan untuk build saja)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Pasang komponen Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "platforms;android-35"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Pasang cargo-apk
        run: |
          if ! command -v cargo-apk >/dev/null; then
            cargo install --git https://github.com/parasyte/cargo-apk.git \
              --rev 282639508eeed7d73f2e1eaeea042da2716436d5 cargo-apk
          fi

      - name: Siapkan ikon aplikasi
        run: |
          mkdir -p apps/wordcraft-android/res/drawable-nodpi
          cp assets/app-icon/hicolor/512x512/apps/ai.storyteller.wordcraft.png \
             apps/wordcraft-android/res/drawable-nodpi/ic_launcher_tile.png

      - name: Bangun APK (debug, kunci debug)
        run: cargo apk build -p wordcraft-android --lib

      - name: Siapkan file rilis
        run: |
          APK="$(ls target/debug/apk/*.apk | grep -v unaligned | head -n1)"
          cp "$APK" WordCraft-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-apk
          path: WordCraft-Android-debug.apk
          if-no-files-found: error

      - name: Rilis ke GitHub Releases
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: WordCraft Android ${{ inputs.tag }}
          prerelease: true
          files: WordCraft-Android-debug.apk
