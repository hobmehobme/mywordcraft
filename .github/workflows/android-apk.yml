name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, mis. v0.1.0-android-alpha (kosongkan untuk build saja)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4

      - name: Tambalan winit (mouse dikenali sebagai mouse, roda scroll)
        run: |
          WINIT_REV=a517b3846ee8457d84ee4975110bfda6797c44dc
          git clone --quiet https://github.com/storytold/winit.git "$RUNNER_TEMP/winit"
          git -C "$RUNNER_TEMP/winit" checkout --quiet "$WINIT_REV"
          git -C "$RUNNER_TEMP/winit" apply "$GITHUB_WORKSPACE/patches/winit-android-mouse.patch"
          python3 - <<'PY'
          import os, re
          s = open("Cargo.toml", encoding="utf-8").read()
          new = 'winit = { path = "%s" }' % os.path.join(os.environ["RUNNER_TEMP"], "winit")
          s, n = re.subn(r'^winit = \{ git = "https://github.com/storytold/winit.git"[^\n]*\}$', new, s, flags=re.M)
          assert n == 1, "baris patch winit di Cargo.toml tidak ditemukan"
          open("Cargo.toml", "w", encoding="utf-8").write(s)
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Pasang komponen Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "platforms;android-35"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Bangun jembatan keyboard sistem (Java ke DEX)
        # Jika langkah ini gagal, APK tetap dibangun tanpa jembatan (keyboard sistem hanya huruf Latin).
        run: |
          B=apps/wordcraft-android/ime
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          : > "$B/classes.dex"
          if rm -rf "$B/out" && mkdir -p "$B/out/classes" \
            && javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_JAR" -d "$B/out/classes" "$B/ImeBridge.java" \
            && "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 26 --lib "$ANDROID_JAR" --output "$B/out" $(find "$B/out/classes" -name '*.class') \
            && cp "$B/out/classes.dex" "$B/classes.dex"; then
            echo "jembatan keyboard: dibangun"
          else
            echo "::warning::jembatan keyboard gagal dibangun; APK tanpa jembatan"
          fi
          ls -l "$B/classes.dex"

      - name: Pasang cargo-apk
        run: |
          if ! command -v cargo-apk >/dev/null; then
            cargo install --git https://github.com/parasyte/cargo-apk.git \
              --rev 282639508eeed7d73f2e1eaeea042da2716436d5 cargo-apk
          fi

      - name: Siapkan ikon aplikasi
        run: |
          mkdir -p apps/wordcraft-android/res/drawable-nodpi
          cp assets/app-icon/hicolor/512x512/apps/ai.storyteller.wordcraft.png \
             apps/wordcraft-android/res/drawable-nodpi/ic_launcher_tile.png

      - name: Bangun APK (debug, kunci debug)
        run: cargo apk build -p wordcraft-android --lib

      - name: Siapkan file rilis
        run: |
          APK="$(ls target/debug/apk/*.apk | grep -v unaligned | head -n1)"
          cp "$APK" WordCraft-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-apk
          path: WordCraft-Android-debug.apk
          if-no-files-found: error

      - name: Rilis ke GitHub Releases
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: WordCraft Android ${{ inputs.tag }}
          prerelease: true
          files: WordCraft-Android-debug.apk
